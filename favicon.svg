<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- an "N" drawn as a small constellation: four nodes joined by links (no background).
       Colours adapt to the browser theme so it stays visible on dark and light tab bars. -->
  <style>
    .link { stroke: #8fd0ff; }
    .node { fill: #cfeaff; }
    .warm { fill: #ffd7b5; }
    .glow { filter: url(#glow); }
    @media (prefers-color-scheme: light) {
      .link { stroke: #2f7fd1; }
      .node { fill: #1f5fa8; }
      .warm { fill: #e0832f; }
      .glow { filter: none; }
    }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g class="glow">
    <path class="link" d="M12 53 L12 11 L52 53 L52 11" fill="none" stroke-width="5"
      stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="node" cx="12" cy="53" r="7"/>
    <circle class="node" cx="12" cy="11" r="7"/>
    <circle class="node" cx="52" cy="53" r="7"/>
    <circle class="warm" cx="52" cy="11" r="7.5"/>
  </g>
</svg>
